services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradeguard
    ports:
      - "5433:5432"   # Expuesto en 5433 para evitar conflicto con lunaroja
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Variables que Spring Boot usará automáticamente
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tradeguard
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Opcional: dialecto (aunque Spring lo detecta solo)
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "4000:3000"   # Frontend accesible en localhost:4000
    environment:
      API_URL: http://app:8080/api
    depends_on:
      - app

volumes:
  pgdata:
